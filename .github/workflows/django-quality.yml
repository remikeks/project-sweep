name: Django Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Migrations and tests
    runs-on: ubuntu-latest
    env:
      # Keep CI self-contained. Production credentials are deliberately not
      # available to pull requests or ordinary test runs.
      DATABASE_URL: sqlite:///ci.sqlite3
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
