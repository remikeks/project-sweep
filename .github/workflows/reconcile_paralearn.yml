name: ParaLearn CBT Reconciliation

on:
  schedule:
    # Runs at minute 0 past every hour (hourly cron)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    name: Reconcile Pending ParaLearn Attempts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reconciliation Management Command
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          PARALEARN_API_BASE_URL: ${{ secrets.PARALEARN_API_BASE_URL }}
          PARALEARN_API_KEY: ${{ secrets.PARALEARN_API_KEY }}
          PARALEARN_ALLOWED_LAUNCH_HOSTS: ${{ secrets.PARALEARN_ALLOWED_LAUNCH_HOSTS }}
          PARALEARN_WEBHOOK_SIGNING_SECRET: ${{ secrets.PARALEARN_WEBHOOK_SIGNING_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python manage.py reconcile_paralearn_results --limit 100
