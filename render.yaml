services:
  - type: web
    name: sweep-demo
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn sweep.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: sweep-demo.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sweep-demo.onrender.com
      - key: GEMINI_API_KEY
        sync: false
