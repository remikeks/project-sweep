{% extends "base.html" %}
{% block title %}Log in — SWEEP{% endblock %}
{% block content %}
  <div class="card" style="max-width:420px; margin:0 auto;">
    <h1 style="font-size:1.6rem;">Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p style="margin-top:14px;"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
    <p style="margin-top:8px;">New to SWEEP? <a href="{% url 'signup' %}">Create an account</a>.</p>
  </div>
{% endblock %}
