{% extends "base.html" %}
{% block title %}Password Reset Complete — SWEEP{% endblock %}
{% block content %}
  <div class="card" style="max-width:460px; margin:0 auto; text-align:center;">
    <h1 style="font-size:1.6rem;">Password updated!</h1>
    <p class="lede" style="font-size:0.95rem; margin-top:12px;">

      <a href="{% url 'login' %}" class="btn btn-primary btn-block">Log in now</a>
    </p>
  </div>
{% endblock %}
