{% extends "base.html" %}
{% block title %}Reset Password — SWEEP{% endblock %}
{% block content %}
  <div class="card" style="max-width:460px; margin:0 auto;">
    <h1 style="font-size:1.6rem;">Reset your password</h1>
    <p class="lede" style="font-size:0.95rem; margin-bottom:16px;">
      Enter your account email address and we'll send you a secure link to reset your password.
    </p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>
    <p style="margin-top:14px;"><a href="{% url 'login' %}">← Return to log in</a></p>
  </div>
{% endblock %}
