{% extends "base.html" %}
{% block title %}Resend Activation Email — SWEEP{% endblock %}
{% block content %}
  <div class="card" style="max-width:460px; margin:0 auto;">
    <h1 style="font-size:1.6rem;">Resend activation link</h1>
    <p class="lede" style="font-size:0.95rem; margin-bottom:16px;">
      Enter the email address you registered with, and we'll send a fresh activation link.
    </p>
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" class="sw-input" required placeholder="you@example.com">
      </p>
      <button type="submit" class="btn btn-primary btn-block">Resend link</button>
    </form>
    <p style="margin-top:14px;"><a href="{% url 'login' %}">← Return to log in</a></p>
  </div>
{% endblock %}
