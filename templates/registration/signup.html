{% extends "base.html" %}
{% block title %}Sign up — SWEEP{% endblock %}
{% block content %}
  <div class="card" style="max-width:460px; margin:0 auto;">
    <h1 style="font-size:1.6rem;">Create your account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
  </div>
{% endblock %}
